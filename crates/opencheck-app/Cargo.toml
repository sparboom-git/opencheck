[package]
name = "opencheck-app"
description = "OpenCheck desktop application: federated IFC viewer and model checker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "opencheck-app"
path = "src/main.rs"

[dependencies]
opencheck-core.workspace = true
anyhow.workspace = true
glam = { workspace = true, features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
egui-phosphor = "0.14"
rfd = "0.17"
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
ureq = { version = "3", features = ["json"] }
webbrowser = "1"
getrandom = "0.3"
png = "0.18.1"

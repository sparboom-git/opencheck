[package]
name = "opencheck-app"
description = "OpenCheck desktop application: federated IFC viewer and model checker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "opencheck-app"
path = "src/main.rs"

[dependencies]
opencheck-core.workspace = true
anyhow.workspace = true
glam = { workspace = true, features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
egui-phosphor = "0.14"
rfd = "0.17"
web-time.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
webbrowser = "1"
png = "0.18.1"

# Desktop only: BCF Live's HTTP client and sign-in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["json"] }
getrandom = "0.3"

# Browser only: start-up, file downloads and async file picking.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
log = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }

[dev-dependencies]
zip.workspace = true

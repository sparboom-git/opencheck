<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCheck</title>
  <meta name="description" content="Open source BIM model checker. IFC files are opened in the browser and never uploaded.">
  <link data-trunk rel="rust" data-bin="opencheck-app" data-wasm-opt="z">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f3f0; color: #2b2b2b; }
    body { font-family: system-ui, sans-serif; }
    canvas#opencheck { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 0 16px; font-size: 15px; line-height: 1.5; pointer-events: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1e1e1e; color: #e4e4e4; }
    }
  </style>
</head>
<body>
  <canvas id="opencheck"></canvas>
  <div id="loading">Loading OpenCheck…</div>
  <script>
    if (!navigator.gpu) {
      document.getElementById("loading").innerHTML =
        "OpenCheck needs a browser with WebGPU, such as a recent Chrome or Edge.";
    }
  </script>
</body>
</html>

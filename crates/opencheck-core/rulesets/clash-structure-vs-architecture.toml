[ruleset]
id = "opencheck.clash.structure-vs-architecture"
name = "Clash: structure vs architecture"
description = "Structural elements that run into doors, windows, stairs or other architectural elements."
version = "1"
author = "OpenCheck"

[[rule]]
id = "structure-vs-openings"
name = "Structure must not intersect doors and windows"
type = "clash"
severity = "critical"
tolerance_mm = 10
between = "different_models"

[rule.a]
disciplines = ["structural"]
classes = ["IfcBeam", "IfcColumn", "IfcMember", "IfcSlab", "IfcWall"]

[rule.b]
disciplines = ["architectural"]
classes = ["IfcDoor", "IfcWindow", "IfcStair", "IfcStairFlight", "IfcRamp"]

[[rule]]
id = "structure-vs-architecture"
name = "Beams and columns must not intersect architectural elements"
description = "Architectural walls and slabs often duplicate structural ones on purpose; only beams and columns are compared with them here."
type = "clash"
severity = "moderate"
tolerance_mm = 20
between = "different_models"

[rule.a]
disciplines = ["structural"]
classes = ["IfcBeam", "IfcColumn", "IfcMember"]

[rule.b]
disciplines = ["architectural"]
classes = ["IfcBuildingElement"]
exclude_classes = ["IfcWall", "IfcSlab", "IfcRoof", "IfcColumn", "IfcBeam", "IfcBuildingElementProxy"]

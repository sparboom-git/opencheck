# Information requirements per building part at the Danish LOD levels
# (LOD 200 DK, 300 DK, 325 DK and 400 DK).
#
# Each [[item]] lists the places the information may be found in. Projects
# and exporters store the same information differently (classification as
# IfcClassificationReference, in CCS/BIM7AA property sets or in company
# property sets), so an item counts as present when any source has a value.
# Patterns are regular expressions on names, ignoring case.
#
# Each [[part]] applies to the elements its selectors match; an element
# belongs to the first part that matches, so specific parts come first.

[standard]
id = "opencheck.information.lod-dk"
name = "Information requirements, LOD DK"
description = "Which information each kind of building part must carry at LOD 200, 300, 325 and 400 DK. Information that follows from geometry and placement (levels, positions) counts as present when the element has geometry."
version = "1"
levels = ["200", "300", "325", "400"]
default_level = "300"

# ---- Classification ------------------------------------------------------

[[item]]
id = "classification-code"
name = "Klassifikationskode"
description = "Classification code, e.g. a CCS, CCI or BIM7AA code."
any = [
    { classification = true },
    { property = "^(CCS|CCI|SfB|FK)?(Classification|ClassCode)$" },
    { property = "^BIM7AA(Type)?Code$" },
    { property = "^Klassifikation(skode)?$" },
]

[[item]]
id = "type-id"
name = "Type (-kode/-ID)"
description = "Type code or type ID in the classification system."
any = [
    { property = "^(CCS|CCI|BIM7AA)(Main)?TypeID$" },
    { property = "^Type ?(kode|id)$" },
]

[[item]]
id = "unique-id"
name = "Unikt ID"
description = "Unique identification of the single element."
any = [
    { property = "^(CCS|CCI)SingleLevelID$" },
    { property = "^Unikt ?ID$" },
]

# ---- Names and types -----------------------------------------------------

[[item]]
id = "type-name"
name = "Typenavn"
description = "Name of the type, from the type object or the object type."
any = [{ type_name = true }, { attribute = "^ObjectType$" }]

[[item]]
id = "name"
name = "Navn"
any = [{ attribute = "^Name$" }]

[[item]]
id = "room-name"
name = "Rumnavn"
any = [{ attribute = "^LongName$" }, { property = "^(Rumnavn|RoomName)$" }]

[[item]]
id = "room-number"
name = "Rumnummer"
any = [{ attribute = "^Name$" }, { property = "^(Rumnummer|RoomNumber)$" }]

# ---- Placement (follows from the model) -----------------------------------

[[item]]
id = "storey"
name = "Placering: Etage"
description = "The element is contained in a building storey."
any = [{ storey = true }, { property = "^(Etage|Level|Storey)$" }]

[[item]]
id = "centre-level"
name = "Centerkote"
any = [{ geometry = true }]

[[item]]
id = "level"
name = "Kote"
any = [{ geometry = true }]

[[item]]
id = "location"
name = "Placering"
any = [{ geometry = true }]

# ---- Dimensions -----------------------------------------------------------

[[item]]
id = "thickness"
name = "Tykkelse"
any = [{ property = "^(Width|Thickness|NominalThickness|TotalThickness|Tykkelse)$" }]

[[item]]
id = "dimension"
name = "Dimension"
any = [
    { property = "^(Nominal(Diameter|DiameterOrWidth|Width|Height)|OuterDiameter|InnerDiameter|Diameter|Width|Height|Size|Dimensions?|Bredde|Højde|Størrelse)$" },
    { attribute = "^Overall(Width|Height)$" },
]

[[item]]
id = "height"
name = "Højde"
any = [
    { property = "^(Height|NominalHeight|OverallHeight|Højde)$" },
    { attribute = "^OverallHeight$" },
]

[[item]]
id = "width"
name = "Bredde"
any = [
    { property = "^(Width|NominalWidth|OverallWidth|Bredde)$" },
    { attribute = "^OverallWidth$" },
]

[[item]]

name = "Areal: Bruttoareal"
any = [{ property = "^(GrossFloorArea|GrossArea|Bruttoareal)$" }]

[[item]]
id = "volume"
name = "Volumen"
any = [{ property = "^(NetVolume|GrossVolume|Volume|Volumen)$" }]


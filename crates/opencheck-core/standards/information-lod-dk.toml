any = [{ property = "^(Depth|NominalDepth|Dybde)$" }]

[[item]]
id = "diameter"
name = "Diameter"
any = [{ property = "^(Diameter|NominalDiameter|OuterDiameter)$" }]

[[item]]
id = "opening-width"
name = "Bredde: Hulmål"
any = [
    { attribute = "^OverallWidth$" },
    { property = "^(Width|OverallWidth|RoughWidth|Bredde|Hulmål ?bredde)$" },
]

[[item]]
id = "opening-height"
name = "Højde: Hulmål"
any = [
    { attribute = "^OverallHeight$" },
    { property = "^(Height|OverallHeight|RoughHeight|Højde|Hulmål ?højde)$" },
]

[[item]]
id = "length"
name = "Længde"
any = [{ property = "^(Length|NominalLength|Længde)$" }]

[[item]]
id = "slope"
name = "Hældning på ramper"
any = [{ property = "^(Slope|RequiredSlope|Hældning)$" }]

[[item]]
id = "area"
name = "Areal"
any = [{ property = "^(NetFloorArea|GrossFloorArea|NetArea|GrossArea|Area|Areal)$" }]

[[item]]
id = "net-area"
name = "Areal: Nettoareal"
any = [{ property = "^(NetFloorArea|NetArea|Nettoareal)$" }]

[[item]]

# ==== Building parts ========================================================
# Recesses and holes come first: they are often proxies in any model.

[[part]]
id = "recess"
name = "Reces- og hulobjekter"
description = "Recesses and holes for installations."
applies = [
    { classes = ["IfcBuildingElementProxy", "IfcDistributionElement", "IfcVirtualElement"], names = ["reces", "\\bhul", "udsparing", "provision ?for ?void", "\\bvoid\\b"] },
    { classes = ["IfcBuildingElementProxy"], properties = [{ pset = "Pset_ProvisionForVoid", name = "Shape" }] },
]
[part.levels]
"300" = ["classification-code", "type-id", "type-name", "width", "height", "depth", "diameter"]
"325" = ["classification-code", "type-id", "type-name", "width", "height", "depth", "diameter", "discipline"]
"400" = ["classification-code", "type-id", "unique-id", "type-name", "width", "height", "depth", "diameter", "discipline", "contract"]

